    const count = 8 + ((ar.length + ai) % 5);
    for (let i = 1; i <= count; i++) {

        artist: ar, album: al, albumArtist: ar, trackNo: i, discNo: 1, year: y0 + ai * 3, duration: 150 + (n * 37) % 200, added: 1700000000 + n * 86400, size: 1000, genres: [['Rock', 'Indie rock'], ['Alternative', 'Hip hop'], ['Electronic'], ['Alternative', 'Rock'], ['Indie rock'], ['Psychedelic', 'Indie'], ['Trip hop']][artists.findIndex(x => x[0] === ar0)], artists: [] });

  const hue = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);

      if (method === 'artist.getInfo') return { artist: { url: 'https://www.last.fm/music/' + ar, stats: { listeners: '2345678', playcount: '98765432' }, tags: { tag: [{ name: 'rock' }, { name: 'alternative' }] }, bio: { content: `${ar} is a band formed in the nineties.\n\nThey released several albums. <a href="https://www.last.fm/music/x">Read more on Last.fm</a>. User-contributed text is available under the Creative Commons By-SA License.` } } };
      if (method === 'album.getInfo') return { album: { wiki: { content: `${params.album} is an album by ${ar}. It was recorded over two years and received wide acclaim; critics praised its production, songwriting and cohesion, and it has since been ranked among the best albums of its decade.\n\nA second paragraph.` } } };
      if (method === 'artist.getTopTags') return { toptags: { tag: [{ name: 'trip-hop', count: 100 }, { name: 'seen live', count: 80 }, { name: 'electronic', count: 60 }] } };
      return { error: 6 };
    },
    covers_status: ({ albums }) => albums.map((a, k) => ({ embedded: k % 3 === 0, any: k % 7 !== 0 })),
    lyrics_status: ({ paths }) => paths.map((_, k) => k % 4 !== 0),
    trash_files: () => [], copy_files: ({ items }) => ({ copied: items.length, skipped: 0, errors: [] }), pick_dir: () => 'E:\\USB',
    embed_covers: () => ({ tracks: [], errors: [] }), write_replaygain: () => ({ tracks: [], errors: [] }),
    discord_update: () => {}, lastfm_love: () => {}, append_history_bulk: () => {},
    image_candidates: ({ kind, artist }) => Array.from({ length: 8 }, (_, i) => ({ title: `${artist} ${i + 1}`, sub: kind === 'album' ? 'album' : `${i * 1000} fans`, thumb: cover(`C:\\x\\${artist}${i}\\y`), url: cover(`C:\\x\\${artist}${i}\\y`) })),
    set_image: ({ source }) => source, reset_image: () => {}, migrate_cache_names: () => [], clean_image_cache: () => ({ files: 0, bytes: 0 }), place_image: () => {}, pick_image: () => null,
    artist_releases: async ({ name }) => ({ name, releases: [{ title: `${name} — New Album`, date: new Date(Date.now() - 20 * 864e5).toISOString().slice(0, 10), kind: 'album', cover: cover(`C:\\r\\${name}\\x`), link: 'https://www.deezer.com' }, { title: 'Upcoming single', date: new Date(Date.now() + 9 * 864e5).toISOString().slice(0, 10), kind: 'single', cover: cover(`C:\\r\\${name}2\\x`), link: 'https://www.deezer.com' }] }),
    song_credits: ({ title }) => ({ title, artist: 'Radiohead', url: 'https://musicbrainz.org', credits: [{ role: 'Writer', names: ['Thom Yorke', 'Jonny Greenwood'] }, { role: 'Producer', names: ['Nigel Godrich'] }, { role: 'Guitar', names: ["Ed O'Brien"] }] }),
    search_lyrics: ({ query, paths }) => paths.slice(0, 4).map(p => ({ path: p, line: `…a line with ${query} in it…` })),
    autoeq_index: () => [{ name: 'Sennheiser HD 600', source: 'oratory1990', path: 'x' }, { name: 'Sennheiser HD 650', source: 'oratory1990', path: 'y' }, { name: 'Sony WH-1000XM4', source: 'oratory1990', path: 'z' }],
    autoeq_profile: () => ({ preamp: -6.3, filters: [{ kind: 'LSC', fc: 105, gain: 6.5, q: 0.7 }, { kind: 'PK', fc: 125, gain: -2.7, q: 0.55 }] }),
    pick_csv_files: () => [{ name: 'My Spotify mix', text: 'Track URI,Track Name,Artist Name(s),Album Name,Track Duration (ms)\n' + tracks.slice(0, 6).map(t => `x,"${t.title}","${t.artist}","${t.album}",${t.duration * 1000}`).join('\n') + '\nx,Missing Song,Nobody,Nothing,200000' }],
    audio_devices: () => ['Speakers (Realtek(R) Audio)', 'Headphones (USB DAC)'], audio_output: ({ device, exclusive }) => ({ device: device || 'Speakers (Realtek(R) Audio)', rate: 48000, exclusive, format: exclusive ? '32-bit' : '' }), audio_crossfeed: () => {},
    party_host: () => ({ port: 47800, code: 'K7QM2D-XHPRTA-9WEN4B', link: 'http://192.168.1.37:47800/?k=a1b2c3d4e5', ip: '192.168.1.37', ipv6Code: 'FAAGBA-4S6RQA-AAAAAA-AAAAAA-AA4X5C-D2U4Y', ipv6Link: 'http://[2800:810:4e2:1a7::5c3]:47800/?k=a1b2c3d4e5' }),
    party_update: () => {}, party_catalog: () => {}, party_stop: () => {}, party_leave: () => {}, party_clock: () => ({ offset: 0, rtt: 4 }),
    party_join: () => { const song = (t, id) => ({ id, title: t.title, artist: t.artist, album: t.album, duration: t.duration, ext: 'flac', startMs: 0, endMs: 0 });
      return { seq: 2, at: Date.now() - 42000, now: Date.now(), ended: false, name: 'Tony', track: song(tracks[5], 5), posMs: 0, paused: false,
        queue: tracks.slice(6, 12).map((t, i) => song(t, 6 + i)), allowRequests: true, guests: [{ name: 'Ana', web: false }, { name: 'Leo', web: true }] }; },

    party_search: ({ query }) => tracks.filter(t => (t.title + ' ' + t.artist).toLowerCase().includes(query.toLowerCase())).slice(0, 8).map(t => ({ id: tracks.indexOf(t), title: t.title, artist: t.artist, album: t.album, duration: t.duration })),
    party_request: () => {}, party_share: async () => { await new Promise(r => setTimeout(r, 300)); return 1000000000; }, forget_artist_photos: () => {},
    organize_files: ({ moves }) => ({ moved: moves.map(m => [m.from, m.to]), errors: [] }),
    set_shortcuts: () => [], watch_folders: () => {}, media_update: () => {}, tray_tooltip: () => {}, taskbar_playing: () => {}, osd_show: () => {}, append_history: () => {},
    get_lyrics: async () => { await new Promise(r => setTimeout(r, 400)); return { found: true, source: 'LRCLIB', synced: Array.from({ length: 40 }, (_, i) => `[${String(Math.floor(i * 4 / 60)).padStart(2, '0')}:${String(i * 4 % 60).padStart(2, '0')}.00]${words[i % words.length]} ${words[(i * 5) % words.length].toLowerCase()} in the ${words[(i * 3) % words.length].toLowerCase()}`).join('\n') }; },

  window.__TAURI__ = {
    core: { invoke: async (c, a) => handlers[c]?.(a || {}), convertFileSrc: p => p.startsWith('data:') ? p : 'about:blank' },

    event: (() => { const L = {}; return { listen: async (n, f) => { (L[n] ||= []).push(f); return () => {}; }, emit: async (n, payload) => (L[n] || []).forEach(f => f({ payload })) }; })(),

})();
</script>
<script>
  fetch('../ui/index.html', { cache: 'no-store' }).then(r => r.text()).then(html => {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    document.body.insertAdjacentHTML('beforeend', doc.body.innerHTML.replace(/<script[\s\S]*?<\/script>/g, ''));
    const e = document.createElement('script'); e.src = '../ui/engine.js?' + Date.now();
    e.onload = () => {
      const s = document.createElement('script'); s.src = '../ui/app.js?' + Date.now();
      s.onload = () => {
        const x = document.createElement('script'); x.src = '../ui/extras.js?' + Date.now();
        x.onload = () => { const y = document.createElement('script'); y.src = '../ui/party.js?' + Date.now(); y.onload = () => { const m = document.createElement('script'); m.src = '../ui/more.js?' + Date.now(); document.body.appendChild(m); }; document.body.appendChild(y); };
        document.body.appendChild(x);
      };
      document.body.appendChild(s);
    };
    document.body.appendChild(e);
  });
</script>
