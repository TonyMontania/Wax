# Builds Wax for Windows, macOS and Linux (x64 and ARM). It only builds: the files are kept as
# artifacts of the run, and releases are created and uploaded by hand from the maintainer's
# account (see docs/RELEASING.md).
name: Build

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target: x86_64-pc-windows-msvc
            bundles: nsis
            portable: win-amd64
          - os: windows-11-arm
            arch: arm64
            target: aarch64-pc-windows-msvc
            bundles: nsis
            portable: win-arm64
          - os: macos-latest
            arch: universal
            target: universal-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            arch: x64
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - os: ubuntu-22.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libdbus-1-dev patchelf rpm file \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect the files
        shell: bash
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)   # the one place the version lives
          T=target/${{ matrix.target }}/release
          mkdir -p out
          case "${{ runner.os }}" in
            Windows)
              cp $T/bundle/nsis/*-setup.exe out/
              mkdir -p portable/Wax
              cp $T/wax.exe portable/Wax/Wax.exe
              cp packaging/portable/README.txt portable/Wax/
              pwsh -NoProfile -Command "Compress-Archive -Path portable/Wax -DestinationPath out/Wax-portable-$VER-${{ matrix.portable }}.zip"
              ;;
            macOS)
              cp $T/bundle/dmg/*.dmg out/
              tar -czf out/Wax_${VER}_universal.app.tar.gz -C $T/bundle/macos Wax.app
              ;;
            Linux)
              cp $T/bundle/deb/*.deb $T/bundle/rpm/*.rpm $T/bundle/appimage/*.AppImage out/
              ;;
          esac
          # One name per processor everywhere: amd64 (x64) and arm64. "amd64" sorts before "arm64",
          # and GitHub lists release files by name: Wax 1.0.0's updater takes the first match.
          for f in out/*; do
            n=$(basename "$f" | sed -e 's/_x64-setup/_amd64-setup/' -e 's/\.x86_64\.rpm$/.amd64.rpm/' -e 's/\.aarch64\.rpm$/.arm64.rpm/' -e 's/_aarch64\.AppImage$/_arm64.AppImage/')
            [ "$n" != "$(basename "$f")" ] && mv "$f" "out/$n"
          done
          ls -la out

      # Opens the app for a few seconds: it has to start and stay open
      - name: Smoke test
        shell: bash
        run: |
          T=target/${{ matrix.target }}/release
          alive() { # command…: runs it 15 s; fails if it exits before
            "$@" & PID=$!
            sleep 15
            if kill -0 $PID 2>/dev/null; then echo "OK: still running"; kill $PID; else wait $PID; echo "FAILED: exited early ($?)"; exit 1; fi
          }
          case "${{ runner.os }}" in
            Windows)
              mkdir -p smoke && unzip -q out/Wax-portable-*.zip -d smoke
              alive smoke/Wax/Wax.exe
              test -d smoke/Wax/data && echo "OK: portable data folder created"
              ;;
            macOS)
              alive $T/bundle/macos/Wax.app/Contents/MacOS/wax
              ;;
            Linux)
              sudo apt-get install -y xvfb dbus-x11 libfuse2
              chmod +x out/*.AppImage
              alive xvfb-run -a dbus-run-session -- out/$(cd out && ls *.AppImage)
              sudo apt-get install -y ./out/*.deb
              alive xvfb-run -a dbus-run-session -- wax
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: wax-${{ runner.os }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  # Windows code signing through SignPath (free for open source). Runs only once the
  # SIGNPATH_ORGANIZATION_ID variable and SIGNPATH_API_TOKEN secret are set (docs/RELEASING.md).
  sign-windows:
    needs: build
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    strategy:
      matrix:
        artifact: [wax-Windows-x64, wax-Windows-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Find the artifact
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[] | select(.name=="${{ matrix.artifact }}") | .id')
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: wax
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows
          github-artifact-id: ${{ steps.find.outputs.id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-signed
          path: signed/*
